// ---- Lucide icon -> React component adapter ----
function makeIcon(name) {
  return function Icon({ className = '' }) {
    const lib = window.lucide && window.lucide.icons;
    let node = lib && lib[name];
    if (!node) return <svg className={className} viewBox="0 0 24 24" />;
    if (node[0] === 'svg') node = node[2]; // older lucide format: ['svg', attrs, children]
    return (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className}>
        {node.map(([tag, attrs], i) => React.createElement(tag, { ...attrs, key: i }))}
      </svg>
    );
  };
}

const INITIAL_SAMPLE_ENTRIES = [];

// ==========================================
// DATE UTILITY FUNCTIONS
// ==========================================

function parseDateStr(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDateStr(dateObj) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function addDays(dateStr, days) {
  const d = parseDateStr(dateStr);
  d.setDate(d.getDate() + days);
  return formatDateStr(d);
}

function addMonths(dateStr, months) {
  const d = parseDateStr(dateStr);
  const originalDay = d.getDate();
  d.setMonth(d.getMonth() + months);
  if (d.getDate() !== originalDay) {
    d.setDate(0);
  }
  return formatDateStr(d);
}

function getStartOfWeek(dateStr) {
  const d = parseDateStr(dateStr);
  const day = d.getDay(); // 0 = Sun, 1 = Mon, ...
  const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Monday start
  const start = new Date(d.setDate(diff));
  return formatDateStr(start);
}

function getWeekDays(dateStr) {
  const startStr = getStartOfWeek(dateStr);
  return Array.from({ length: 7 }, (_, i) => addDays(startStr, i));
}

function getMonthGridDays(dateStr) {
  const d = parseDateStr(dateStr);
  const year = d.getFullYear();
  const month = d.getMonth();

  const firstDayOfMonth = new Date(year, month, 1);
  const lastDayOfMonth = new Date(year, month + 1, 0);

  // Monday-based week index (0 = Mon, 6 = Sun)
  const startOffset = (firstDayOfMonth.getDay() + 6) % 7;
  const totalDaysInMonth = lastDayOfMonth.getDate();

  const days = [];

  // Previous month padding
  for (let i = startOffset - 1; i >= 0; i--) {
    const prevDate = new Date(year, month, -i);
    days.push({
      dateStr: formatDateStr(prevDate),
      dayNumber: prevDate.getDate(),
      isCurrentMonth: false
    });
  }

  // Current month days
  for (let i = 1; i <= totalDaysInMonth; i++) {
    const currDate = new Date(year, month, i);
    days.push({
      dateStr: formatDateStr(currDate),
      dayNumber: i,
      isCurrentMonth: true
    });
  }

  // Next month padding to fill 35 or 42 cells
  const totalCells = days.length > 35 ? 42 : 35;
  const remaining = totalCells - days.length;
  for (let i = 1; i <= remaining; i++) {
    const nextDate = new Date(year, month + 1, i);
    days.push({
      dateStr: formatDateStr(nextDate),
      dayNumber: i,
      isCurrentMonth: false
    });
  }

  return days;
}

function formatReadableDate(dateStr, options = { month: 'short', day: 'numeric', year: 'numeric' }) {
  const d = parseDateStr(dateStr);
  return d.toLocaleDateString('en-US', options);
}

// ==========================================
// MAIN COMPONENT
// ==========================================

function App() {
  // State: Entries persisted in localStorage
  const [entries, setEntries] = useState(() => {
    try {
      const saved = localStorage.getItem('life_catalog_entries_v1');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {
      console.error('Failed to read from localStorage:', e);
    }
    return INITIAL_SAMPLE_ENTRIES;
  });

  useEffect(() => {
    try {
      localStorage.setItem('life_catalog_entries_v1', JSON.stringify(entries));
    } catch (e) {
      console.error('Failed to save to localStorage:', e);
    }
  }, [entries]);

  // Navigation & View State
  const [viewMode, setViewMode] = useState('month'); // 'month' | 'week' | 'day'
  const [selectedDate, setSelectedDate] = useState(DEFAULT_TODAY_STR);

  // Filter Mode State: 'notable' (Levels 3 & 4) vs 'detailed' (All Levels 1-4)
  const [filterMode, setFilterMode] = useState('detailed'); // 'detailed' | 'notable'
  const [notableThreshold, setNotableThreshold] = useState(3); // Default 3+ (Levels 3 & 4)
  const [searchQuery, setSearchQuery] = useState('');

  // Modal State for Add / Edit / View
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [editingEntry, setEditingEntry] = useState(null);
  const [viewingEntry, setViewingEntry] = useState(null);
  const [deleteConfirmId, setDeleteConfirmId] = useState(null);

  // Data Backup (Export / Import) Modal & Toast State
  const [isDataModalOpen, setIsDataModalOpen] = useState(false);
  const [importStrategy, setImportStrategy] = useState('merge'); // 'merge' | 'replace'
  const [dataFeedback, setDataFeedback] = useState(null); // { type: 'success' | 'error', message: string }
  const [toastNotification, setToastNotification] = useState(null);
  const fileInputRef = useRef(null);

  const showToast = (message, type = 'success') => {
    setToastNotification({ message, type });
    setTimeout(() => {
      setToastNotification(prev => (prev?.message === message ? null : prev));
    }, 4000);
  };

  // Form State inside Modal
  const [formData, setFormData] = useState({
    title: '',
    date: DEFAULT_TODAY_STR,
    time: '12:00',
    importance: 3,
    notes: ''
  });

  // ==========================================
  // NAVIGATION HANDLERS
  // ==========================================

  const handlePrev = () => {
    if (viewMode === 'month') {
      setSelectedDate(prev => addMonths(prev, -1));
    } else if (viewMode === 'week') {
      setSelectedDate(prev => addDays(prev, -7));
    } else {
      setSelectedDate(prev => addDays(prev, -1));
    }
  };

  const handleNext = () => {
    if (viewMode === 'month') {
      setSelectedDate(prev => addMonths(prev, 1));
    } else if (viewMode === 'week') {
      setSelectedDate(prev => addDays(prev, 7));
    } else {
      setSelectedDate(prev => addDays(prev, 1));
    }
  };

  const handleToday = () => {
    setSelectedDate(DEFAULT_TODAY_STR);
  };

  // ==========================================
  // JSON EXPORT & IMPORT HANDLERS
  // ==========================================

  const handleExportJSON = () => {
    try {
      const exportPayload = {
        app: 'LifeChronicle',
        version: '1.0',
        exportedAt: new Date().toISOString(),
        entryCount: entries.length,
        entries
      };

      const jsonString = JSON.stringify(exportPayload, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const todayFileDate = formatDateStr(new Date());
      const link = document.createElement('a');
      link.href = url;
      link.download = `life-chronicle-backup-${todayFileDate}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      setDataFeedback({
        type: 'success',
        message: `Successfully exported ${entries.length} entries to life-chronicle-backup-${todayFileDate}.json`
      });
      showToast(`Exported ${entries.length} achievements to JSON`);
    } catch (err) {
      console.error('Export failed:', err);
      setDataFeedback({
        type: 'error',
        message: 'Failed to export JSON file. Please try again.'
      });
    }
  };

  const validateAndNormalizeEntries = (rawList) => {
    if (!Array.isArray(rawList)) return null;
    const validEntries = [];

    for (let i = 0; i < rawList.length; i++) {
      const item = rawList[i];
      if (!item || typeof item !== 'object') continue;
      if (typeof item.title !== 'string' || !item.title.trim()) continue;
      if (typeof item.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(item.date)) continue;

      const imp = Number(item.importance);
      const normalizedImportance = [1, 2, 3, 4].includes(imp) ? imp : 2;

      validEntries.push({
        id: item.id ? String(item.id) : `imported-${Date.now()}-${i}`,
        title: item.title.trim(),
        date: item.date,
        time: typeof item.time === 'string' ? item.time : '12:00',
        importance: normalizedImportance,
        notes: typeof item.notes === 'string' ? item.notes : ''
      });
    }

    return validEntries;
  };

  const handleImportFileChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        // Support both wrapped backup format ({ entries: [...] }) and raw array format ([...])
        const rawEntries = Array.isArray(parsed)
          ? parsed
          : Array.isArray(parsed?.entries)
          ? parsed.entries
          : null;

        if (!rawEntries) {
          setDataFeedback({
            type: 'error',
            message: 'Invalid backup format: JSON must contain an "entries" array or be an array of achievement objects.'
          });
          return;
        }

        const validated = validateAndNormalizeEntries(rawEntries);
        if (!validated || validated.length === 0) {
          setDataFeedback({
            type: 'error',
            message: 'No valid entries found in file. Each entry requires at least a "title" and a "YYYY-MM-DD" "date".'
          });
          return;
        }

        if (importStrategy === 'replace') {
          setEntries(validated);
          setDataFeedback({
            type: 'success',
            message: `Replaced catalog with ${validated.length} imported entries from "${file.name}".`
          });
          showToast(`Imported & replaced ${validated.length} entries!`);
        } else {
          // Merge by ID (update matching IDs, append new ones)
          setEntries(prev => {
            const map = new Map(prev.map(item => [item.id, item]));
            let updatedCount = 0;
            let addedCount = 0;

            validated.forEach(item => {
              if (map.has(item.id)) {
                updatedCount++;
              } else {
                addedCount++;
              }
              map.set(item.id, item);
            });

            const merged = Array.from(map.values());
            setDataFeedback({
              type: 'success',
              message: `Merged "${file.name}": ${addedCount} new added, ${updatedCount} existing updated (${merged.length} total).`
            });
            showToast(`Merged ${validated.length} entries (${addedCount} new, ${updatedCount} updated)`);
            return merged;
          });
        }
      } catch (err) {
        console.error('Failed to parse JSON:', err);
        setDataFeedback({
          type: 'error',
          message: 'Could not parse JSON file. Please verify the file is valid JSON.'
        });
      } finally {
        if (fileInputRef.current) {
          fileInputRef.current.value = '';
        }
      }
    };

    reader.readAsText(file);
  };

  // ==========================================
  // CRUD HANDLERS
  // ==========================================

  const openNewEntryModal = (dateStr = selectedDate, defaultImportance = 3) => {
    setEditingEntry(null);
    setFormData({
      title: '',
      date: dateStr,
      time: '12:00',
      importance: defaultImportance,
      notes: ''
    });
    setIsModalOpen(true);
  };

  const openEditEntryModal = (entry) => {
    setViewingEntry(null);
    setEditingEntry(entry);
    setFormData({
      title: entry.title,
      date: entry.date,
      time: entry.time || '',
      importance: entry.importance || 2,
      notes: entry.notes || ''
    });
    setIsModalOpen(true);
  };

  const handleSaveEntry = (e) => {
    e.preventDefault();
    if (!formData.title.trim()) return;

    if (editingEntry) {
      setEntries(prev =>
        prev.map(item =>
          item.id === editingEntry.id
            ? { ...item, ...formData, title: formData.title.trim() }
            : item
        )
      );
    } else {
      const newEntry = {
        id: `entry-${Date.now()}`,
        ...formData,
        title: formData.title.trim()
      };
      setEntries(prev => [...prev, newEntry]);
    }
    setIsModalOpen(false);
    setEditingEntry(null);
  };

  const handleDeleteEntry = (id) => {
    setEntries(prev => prev.filter(item => item.id !== id));
    setDeleteConfirmId(null);
    if (viewingEntry && viewingEntry.id === id) {
      setViewingEntry(null);
    }
  };

  // ==========================================
  // FILTERED ENTRIES & PERIOD STATS
  // ==========================================

  // Filter entries according to Notable vs Detailed mode, category, and search query
  const filteredEntries = useMemo(() => {
    return entries
      .filter(entry => {
        if (filterMode === 'notable' && entry.importance < notableThreshold) {
          return false;
        }

        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matchTitle = entry.title.toLowerCase().includes(q);
          const matchNotes = (entry.notes || '').toLowerCase().includes(q);
          if (!matchTitle && !matchNotes) return false;
        }
        return true;
      })
      .sort((a, b) => {
        // Sort by importance descending first, then by time
        if (b.importance !== a.importance) return b.importance - a.importance;
        return (a.time || '').localeCompare(b.time || '');
      });
  }, [entries, filterMode, notableThreshold, searchQuery]);

  // Group filtered entries by date string for fast lookup
  const entriesByDate = useMemo(() => {
    const map = {};
    filteredEntries.forEach(entry => {
      if (!map[entry.date]) map[entry.date] = [];
      map[entry.date].push(entry);
    });
    return map;
  }, [filteredEntries]);

  // All entries (unfiltered by Notable toggle) for current period stats comparison
  const periodStats = useMemo(() => {
    let periodStart = selectedDate;
    let periodEnd = selectedDate;
    let periodLabel = '';

    if (viewMode === 'month') {
      const d = parseDateStr(selectedDate);
      const first = new Date(d.getFullYear(), d.getMonth(), 1);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      periodStart = formatDateStr(first);
      periodEnd = formatDateStr(last);
      periodLabel = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    } else if (viewMode === 'week') {
      const weekDays = getWeekDays(selectedDate);
      periodStart = weekDays[0];
      periodEnd = weekDays[6];
      periodLabel = `${formatReadableDate(periodStart, { month: 'short', day: 'numeric' })} – ${formatReadableDate(periodEnd, { month: 'short', day: 'numeric', year: 'numeric' })}`;
    } else {
      periodLabel = formatReadableDate(selectedDate, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    const inPeriod = entries.filter(e => e.date >= periodStart && e.date <= periodEnd);
    const milestones = inPeriod.filter(e => e.importance === 4).length;
    const keyProgress = inPeriod.filter(e => e.importance === 3).length;
    const notableCount = inPeriod.filter(e => e.importance >= notableThreshold).length;
    const hiddenByFilter = filterMode === 'notable' ? inPeriod.length - notableCount : 0;

    return {
      periodLabel,
      total: inPeriod.length,
      notableCount,
      milestones,
      keyProgress,
      hiddenByFilter,
      inPeriodEntries: inPeriod.sort((a, b) => b.importance - a.importance || b.date.localeCompare(a.date))
    };
  }, [entries, selectedDate, viewMode, filterMode, notableThreshold]);

  // Helper to render category badge
  const getCategoryBadge = (catId) => {
    const cat = CATEGORIES.find(c => c.id === catId) || CATEGORIES[4];
    const IconComp = cat.icon;
    return (
      <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${cat.color}`}>
        <IconComp className="w-3 h-3" />
        {cat.label}
      </span>
    );
  };

  // ==========================================
  // RENDER
  // ==========================================

  return (
    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-white">
      {/* ========================================== */}
      {/* TOP HEADER BAR                             */}
      {/* ========================================== */}
      <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
          <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            {/* Brand Title & Subtitle */}
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-amber-500/20">
                  <Trophy className="w-5 h-5" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white">
                      LifeChronicle
                    </h1>
                    <span className="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300/60 dark:border-amber-800">
                      Achievement & Progress Catalog
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Track milestones, daily progress, and memorable wins so you never forget how far you’ve come.
                  </p>
                </div>
              </div>

              {/* Mobile "+ Log" & Backup buttons */}
              <div className="flex items-center gap-2 lg:hidden">
                <button
                  onClick={() => {
                    setDataFeedback(null);
                    setIsDataModalOpen(true);
                  }}
                  className="inline-flex items-center gap-1.5 px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xs shadow-2xs hover:bg-slate-50 dark:hover:bg-slate-700 transition cursor-pointer"
                  title="Backup & Restore Data (JSON)"
                >
                  <Database className="w-4 h-4 text-amber-500" />
                  <span>Backup</span>
                </button>
                <button
                  onClick={() => openNewEntryModal(selectedDate)}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 font-semibold text-xs shadow-sm hover:opacity-90 transition cursor-pointer"
                >
                  <Plus className="w-4 h-4" />
                  <span>Log Win</span>
                </button>
              </div>

                    type="time"
                    value={formData.time}
                    onChange={(e) => setFormData({ ...formData, time: e.target.value })}
                    className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>

              </div>

              {/* Notes / Reflection */}
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">
                  Notes & Reflection
                </label>
                <textarea
                  rows={3}
                  value={formData.notes}
                  onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                  placeholder="Add context, metrics, how it felt, or what you learned..."
                  className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                />
              </div>

              {/* Modal Actions */}
              <div className="flex items-center justify-end gap-2 pt-2">
                <button
                  type="button"
                  onClick={() => setIsModalOpen(false)}
                  className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 text-xs font-semibold hover:opacity-90 transition cursor-pointer shadow-sm"
                >
                  {editingEntry ? 'Save Changes' : 'Save to Catalog'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ========================================== */}
      {/* MODAL: DELETE CONFIRMATION                 */}
      {/* ========================================== */}
      {deleteConfirmId && (
        <div
          className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4"
          onClick={() => setDeleteConfirmId(null)}
        >
          <div
            className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 max-w-sm w-full p-5 shadow-xl text-center"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 flex items-center justify-center mx-auto mb-3">
              <Trash2 className="w-5 h-5" />
            </div>
            <h4 className="text-base font-bold text-slate-900 dark:text-white">
              Remove this entry?
            </h4>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-5">
              This entry will be permanently removed from your achievement catalog.
            </p>
            <div className="flex items-center justify-center gap-2">
              <button
                onClick={() => setDeleteConfirmId(null)}
                className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
              >
                Cancel
              </button>
              <button
                onClick={() => handleDeleteEntry(deleteConfirmId)}
                className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold cursor-pointer"
              >
                Delete Entry
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
